name: Upstream drift check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  lfs-download-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare official stable and public-test channels with audited manifest
        run: ./scripts/check-upstream.sh
